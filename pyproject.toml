[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sportslakehouse"
version = "0.1.0"
description = "Bundesliga data platform: medallion lakehouse, ML forecasting, MLOps, API"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0",
    "pyarrow>=14",
    "duckdb>=1.0",
    "requests>=2.31",
    "dbt-core>=1.9,<2",
    "dbt-duckdb>=1.9,<2",
    "pandera>=0.24",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.5",
    "pre-commit>=3.7",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "data: tests that need the real Bronze layer (run `make bronze` first)",
]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
