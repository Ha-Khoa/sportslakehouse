version: 2

models:
  - name: int_matches_checked
    description: >
      Staging rows with canonical team ids, match_id and quarantine_reason
      (NULL = clean row). Single place where the row-level rules live.

  - name: silver_matches
    description: One row per clean match. match_id is md5(match_date, home_team_id, away_team_id).
    columns:
      - name: match_id
        data_tests: [unique, not_null]
      - name: season
        data_tests: [not_null]
      - name: match_date
        data_tests: [not_null]
      - name: home_team_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('silver_teams')
                field: team_id
      - name: away_team_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('silver_teams')
                field: team_id
      - name: home_goals
        data_tests: [not_null]
      - name: away_goals
        data_tests: [not_null]
      - name: result
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["H", "D", "A"]

  - name: silver_team_matches
    description: Two rows per match (one per team's point of view). Grain (match_id, team_id).
    columns:
      - name: match_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('silver_matches')
                field: match_id
      - name: team_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('silver_teams')
                field: team_id
      - name: is_home
        data_tests: [not_null]
      - name: points
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [0, 1, 3]

  - name: silver_match_odds
    description: >
      Decimal odds in long format. Grain (match_id, bookmaker, is_closing). Only complete
      home/draw/away triples are kept.
    columns:
      - name: match_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('silver_matches')
                field: match_id
      - name: bookmaker
        data_tests:
          - accepted_values:
              arguments:
                values: ["bet365", "pinnacle", "market_avg"]
      - name: odds_home
        data_tests: [not_null]
      - name: odds_draw
        data_tests: [not_null]
      - name: odds_away
        data_tests: [not_null]

  - name: silver_teams
    description: One row per team that appears in the data, with the first and last season.
    columns:
      - name: team_id
        data_tests: [unique, not_null]
      - name: team_name
        data_tests: [not_null]

  - name: silver_quarantine_matches
    description: Rows that failed a row-level rule, with the reason. Normally empty.
