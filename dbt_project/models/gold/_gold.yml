version: 2

models:
  - name: int_team_form
    description: >
      Rolling form of each team before each match (windows end at 1 PRECEDING).
      Grain (match_id, team_id).
    columns:
      - name: match_id
        data_tests: [not_null]
      - name: team_id
        data_tests: [not_null]
      - name: n_prev_10
        description: How many matches were really inside the 10-match window (0 to 10).
        data_tests: [not_null]

  - name: elo_ratings
    description: >
      Elo of each team BEFORE each match (python model, pure function features/elo.py).
      Also copied to data/lake/gold/elo_ratings.parquet by the post-hook.
    config:
      post_hook: "copy {{ this }} to '{{ var('lake_dir') }}/gold/elo_ratings.parquet' (format parquet)"
    columns:
      - name: match_id
        data_tests: [not_null]
      - name: team_id
        data_tests: [not_null]
      - name: elo_pre
        data_tests: [not_null]

  - name: fct_match_features
    description: >
      One row per match for ML: home/away features known before kick-off, differences and
      the labels (result, home_goals, away_goals).
    columns:
      - name: match_id
        data_tests:
          - unique
          - not_null
          - relationships:
              arguments:
                to: ref('silver_matches')
                field: match_id
      - name: result
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["H", "D", "A"]
      - name: h_elo
        data_tests: [not_null]
      - name: a_elo
        data_tests: [not_null]

  - name: int_h2h
    description: >
      Points of a team in its last up to 3 meetings with the same opponent, before each match
      (window ends at 1 PRECEDING). Grain (match_id, team_id).
    columns:
      - name: h2h_n
        data_tests: [not_null]

  - name: mart_standings
    description: >
      League table after each team's k-th match of a season. The row with matches_played = 34
      of a completed season is the final table. Grain (season, matches_played, team_id).
    columns:
      - name: team_id
        data_tests: [not_null]
      - name: rank
        data_tests: [not_null]

  - name: mart_team_form
    description: >
      Form of a team as of the end of each match day, INCLUDING that day's match (for dashboard
      and API only, never for ML features). Grain (team_id, match_date).
    columns:
      - name: team_id
        data_tests: [not_null]
      - name: last_5
        description: Last five results oldest to newest, e.g. WWDLW.

  - name: mart_unbeaten_streaks
    description: Longest unbeaten run (wins + draws) per team and season (gaps and islands).
    columns:
      - name: streak_length
        data_tests: [not_null]

  - name: mart_home_away_by_season
    description: Result shares and average goals per season (home advantage over time).
    columns:
      - name: season
        data_tests: [unique, not_null]

